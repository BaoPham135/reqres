name: API Test (Newman)

on:
  push:
    branches: [ main ]

jobs:
  api-test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.BASE_URL }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and htmlextra reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Start mock ReqRes server (only when BASE_URL secret is empty)
        if: env.BASE_URL == ''
        run: |
          node mock-server.js &
          for i in $(seq 1 20); do
            curl -s http://localhost:3000/api/users/2 > /dev/null && break
            sleep 1
          done

      - name: Run data-driven API tests
        run: |
          newman run ReqRes_Collection.json \
            -e ReqRes_Environment.json \
            -d users.csv \
            --delay-request 1000 \
            --env-var "baseUrl=${{ secrets.BASE_URL || 'http://localhost:3000' }}" \
            --env-var "api-key=${{ secrets.API_KEY }}" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export report.html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: report.html
          if-no-files-found: warn
